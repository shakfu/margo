name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt drift is the failure this job exists to catch: it is
      # invisible locally until someone runs `make fmt` and produces a
      # diff across files they never touched.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^frontend/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # frontend/dist is gitignored, so the //go:embed all:frontend/dist
      # directive in main.go matches nothing in a fresh checkout and every
      # go command fails to build the root package. Vet and test never read
      # the bundle, so a placeholder directory is enough; the real assets
      # only matter to `wails build`.
      - name: stub embedded frontend assets
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: go vet
        run: go vet ./...

      # -race because the permission broker and the stream cancel
      # registry are the parts most likely to be wrong under concurrency
      # and least likely to fail deterministically without it.
      - name: go test
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: svelte-check
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: vitest
        run: npm run test
